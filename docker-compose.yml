services:
  database:
    container_name: cascade-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 4200:4200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cascade-pro-server
  redis:
    container_name: cascade-redis
    image: redis:5.0
    restart: unless-stopped
    ports:
      - 6379:6379
    command: redis-server
    volumes:
      - redis_data:/data
    networks:
      - cascade-pro-server

volumes:
  postgres_data:
  redis_data:

networks:
  cascade-pro-server:
