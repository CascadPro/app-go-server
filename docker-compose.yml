services:
  database:
    container_name: cascade-postgres
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cascade-pro-server
  redis:
    container_name: cascade-redis
    image: redis:5.0
    restart: always
    ports:
      - 6379:6379
    command: redis-server
    volumes:
      - redis_data:/data
    networks:
      - cascade-pro-server

volumes:
  postgres_data:
  redis_data:

networks:
  cascade-pro-server:
